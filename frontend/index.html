<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Personal Financial Management & Wealth Control System — your financial control center for income, budgets, savings, investments, and lending." />
    <title>PFMS — Personal Financial Management System</title>
  </head>
  <body>
    <script>
      // Applied before first paint to avoid a light-mode flash for users
      // who've chosen dark mode — see src/lib/theme.ts for the toggle.
      (function () {
        try {
          var stored = localStorage.getItem('pfms_theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
